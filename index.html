<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahadi - BGS</title>
    
    <!-- Material Design Icons (MDI) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.2.96/css/materialdesignicons.min.css">
    
    <!-- Google Fonts Fallback (Roboto) in case Google Sans is not installed locally -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS for rapid styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        /* Modern 3-Color Palette */
                        primary: '#1A73E8',   /* A strong, trustworthy blue */
                        secondary: '#F1F3F4', /* A clean, soft gray for backgrounds */
                        accent: '#EA4335',    /* A vibrant red for accents and interactions */
                        textDark: '#202124'
                    },
                    fontFamily: {
                        sans: ['"Google Sans"', 'Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: theme('colors.secondary');
            color: theme('colors.textDark');
            font-family: 'Google Sans', Roboto, sans-serif;
        }
        
        .file-card {
            transition: all 0.2s ease-in-out;
        }
        
        .file-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .icon-accent {
            color: theme('colors.primary');
            transition: color 0.2s ease-in-out;
        }

        .file-card:hover .icon-accent {
            color: theme('colors.accent');
        }

        /* Modal transitions */
        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(2px);
        }
        
        .hidden-modal {
            display: none !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col relative">

    <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="mdi mdi-folder-multiple text-primary text-3xl"></span>
                <h1 class="text-2xl font-bold tracking-tight text-primary">Ahadi - BGS</h1>
            </div>
            <div>
                <button id="open-modal-btn" class="text-gray-500 hover:text-accent transition-colors flex items-center gap-1 bg-gray-100 hover:bg-gray-200 px-3 py-2 rounded-lg font-medium text-sm">
                    <span class="mdi mdi-plus-circle-outline text-lg"></span>
                    <span class="hidden sm:inline">Add File</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-lg font-medium text-gray-700">My Files</h2>
            <div class="flex gap-2">
                <span id="loading-spinner" class="mdi mdi-loading mdi-spin text-xl text-primary hidden"></span>
            </div>
        </div>

        <!-- File Grid (Populated by Firebase) -->
        <div id="file-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Loading state -->
            <div class="col-span-full text-center py-10 text-gray-500">
                <span class="mdi mdi-loading mdi-spin text-3xl mb-2 block"></span>
                Loading your files...
            </div>
        </div>
    </main>

    <!-- Add File Modal -->
    <div id="add-modal" class="fixed inset-0 z-50 flex items-center justify-center modal-overlay hidden-modal">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md mx-4 overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
                <h3 class="text-lg font-semibold text-gray-800">Add New File Link</h3>
                <button id="close-modal-btn" class="text-gray-400 hover:text-accent transition-colors">
                    <span class="mdi mdi-close text-2xl"></span>
                </button>
            </div>
            <form id="add-file-form" class="p-6">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1" for="file-name">File Name</label>
                    <input type="text" id="file-name" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                </div>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1" for="file-type">File Type</label>
                    <select id="file-type" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent bg-white">
                        <option value="pdf">PDF Document</option>
                        <option value="image">Image</option>
                        <option value="spreadsheet">Spreadsheet</option>
                        <option value="word">Word Document</option>
                        <option value="zip">Zip Archive</option>
                        <option value="folder">Folder / Drive Link</option>
                        <option value="link">Other Link</option>
                    </select>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-1" for="file-url">Link / URL</label>
                    <input type="url" id="file-url" required placeholder="https://..." class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                </div>
                
                <div class="flex justify-end gap-3">
                    <button type="button" id="cancel-modal-btn" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition-colors font-medium">Cancel</button>
                    <button type="submit" id="submit-file-btn" class="px-4 py-2 bg-primary hover:bg-blue-700 text-white rounded-lg transition-colors font-medium flex items-center gap-2">
                        <span>Save File</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <footer class="bg-white border-t border-gray-200 mt-auto py-6">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row justify-between items-center gap-4">
            <p class="text-sm text-gray-500">© 2026 Ahadi - BGS. All rights reserved.</p>
            <div class="flex gap-4">
                <a href="#" class="text-gray-400 hover:text-primary transition-colors"><span class="mdi mdi-github text-xl"></span></a>
                <a href="#" class="text-gray-400 hover:text-primary transition-colors"><span class="mdi mdi-twitter text-xl"></span></a>
                <a href="#" class="text-gray-400 hover:text-primary transition-colors"><span class="mdi mdi-email text-xl"></span></a>
            </div>
        </div>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Environment variables setup
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'ahadi-bgs-default';
        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : { projectId: "demo-project" }; // Mock config for preview if undefined

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        let currentUserId = null;
        let unsubscribeSnapshot = null;

        // DOM Elements
        const fileGrid = document.getElementById('file-grid');
        const addModal = document.getElementById('add-modal');
        const openModalBtn = document.getElementById('open-modal-btn');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const cancelModalBtn = document.getElementById('cancel-modal-btn');
        const addFileForm = document.getElementById('add-file-form');
        const submitFileBtn = document.getElementById('submit-file-btn');
        const loadingSpinner = document.getElementById('loading-spinner');

        const fileTypeConfig = {
            pdf: { icon: 'mdi-file-pdf-box', color: 'text-red-500', bg: 'bg-red-50' },
            image: { icon: 'mdi-image', color: 'text-blue-500', bg: 'bg-blue-50' },
            spreadsheet: { icon: 'mdi-file-excel', color: 'text-green-600', bg: 'bg-green-50' },
            word: { icon: 'mdi-file-word', color: 'text-blue-600', bg: 'bg-blue-50' },
            zip: { icon: 'mdi-folder-zip', color: 'text-orange-500', bg: 'bg-orange-50' },
            folder: { icon: 'mdi-folder', color: 'text-gray-600', bg: 'bg-gray-100' },
            link: { icon: 'mdi-link-variant', color: 'text-purple-500', bg: 'bg-purple-50' }
        };

        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                
                if (auth.currentUser) {
                    currentUserId = auth.currentUser.uid;
                    loadFiles();
                }
            } catch (error) {
                console.error("Authentication failed:", error);
                fileGrid.innerHTML = `<div class="col-span-full text-center text-accent py-10">Failed to authenticate. Please try again.</div>`;
            }
        }

        function loadFiles() {
            if (!currentUserId) return;
            
            loadingSpinner.classList.remove('hidden');
            
            // STRICT PATH RULE: Private user data
            const filesRef = collection(db, 'artifacts', appId, 'users', currentUserId, 'files');
            
            if (unsubscribeSnapshot) unsubscribeSnapshot();
            
            unsubscribeSnapshot = onSnapshot(filesRef, (snapshot) => {
                fileGrid.innerHTML = '';
                
                if (snapshot.empty) {
                    fileGrid.innerHTML = `
                        <div class="col-span-full text-center py-12 flex flex-col items-center">
                            <span class="mdi mdi-folder-open-outline text-6xl text-gray-300 mb-3"></span>
                            <p class="text-gray-500 text-lg">No files found.</p>
                            <p class="text-gray-400 text-sm mt-1">Click "Add File" to save a new link.</p>
                        </div>
                    `;
                } else {
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        renderFileCard(doc.id, data);
                    });
                }
                loadingSpinner.classList.add('hidden');
            }, (error) => {
                console.error("Error fetching files:", error);
                fileGrid.innerHTML = `<div class="col-span-full text-center text-accent py-10">Error loading files.</div>`;
                loadingSpinner.classList.add('hidden');
            });
        }

        function renderFileCard(docId, data) {
            const config = fileTypeConfig[data.type] || fileTypeConfig.link;
            const dateStr = data.createdAt ? new Date(data.createdAt).toLocaleDateString() : 'Unknown date';
            
            const cardHTML = `
                <div class="file-card bg-white rounded-xl p-5 border border-gray-100 flex flex-col h-full group relative focus-within:ring-2 focus-within:ring-primary">
                    <a href="${data.url}" target="_blank" rel="noopener noreferrer" class="absolute inset-0 z-0 outline-none"></a>
                    
                    <div class="flex justify-between items-start mb-4 z-10 relative pointer-events-none">
                        <div class="${config.bg} p-3 rounded-lg">
                            <span class="mdi ${config.icon} text-4xl ${config.color} icon-accent"></span>
                        </div>
                        <button class="delete-btn text-gray-300 hover:text-accent cursor-pointer transition-colors p-1 rounded-full hover:bg-red-50 pointer-events-auto" data-id="${docId}" title="Delete File">
                            <span class="mdi mdi-delete-outline text-xl"></span>
                        </button>
                    </div>
                    
                    <div class="flex-grow z-10 relative pointer-events-none">
                        <h3 class="text-md font-semibold text-gray-800 line-clamp-2 group-hover:text-primary transition-colors">${escapeHTML(data.name)}</h3>
                        <p class="text-sm text-gray-500 mt-1">Added: ${dateStr}</p>
                    </div>
                </div>
            `;
            
            fileGrid.insertAdjacentHTML('beforeend', cardHTML);
        }

        // Helper to prevent XSS
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag])
            );
        }

        
        // Modal toggles
        function toggleModal(show) {
            if (show) {
                addModal.classList.remove('hidden-modal');
                document.getElementById('file-name').focus();
            } else {
                addModal.classList.add('hidden-modal');
                addFileForm.reset();
            }
        }

        openModalBtn.addEventListener('click', () => toggleModal(true));
        closeModalBtn.addEventListener('click', () => toggleModal(false));
        cancelModalBtn.addEventListener('click', () => toggleModal(false));

        // Close modal on outside click
        addModal.addEventListener('click', (e) => {
            if (e.target === addModal) toggleModal(false);
        });

        // Handle Add form submission
        addFileForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUserId) return;

            const name = document.getElementById('file-name').value.trim();
            const type = document.getElementById('file-type').value;
            const url = document.getElementById('file-url').value.trim();
            
            if (!name || !url) return;

            const originalBtnText = submitFileBtn.innerHTML;
            submitFileBtn.innerHTML = '<span class="mdi mdi-loading mdi-spin"></span> Saving...';
            submitFileBtn.disabled = true;

            try {
                const filesRef = collection(db, 'artifacts', appId, 'users', currentUserId, 'files');
                await addDoc(filesRef, {
                    name,
                    type,
                    url,
                    createdAt: new Date().toISOString()
                });
                toggleModal(false);
            } catch (error) {
                console.error("Error adding document: ", error);
                alert("Failed to add file. Please try again.");
            } finally {
                submitFileBtn.innerHTML = originalBtnText;
                submitFileBtn.disabled = false;
            }
        });

        // Handle Delete Action via event delegation
        fileGrid.addEventListener('click', async (e) => {
            const deleteBtn = e.target.closest('.delete-btn');
            if (!deleteBtn) return;
            
            // Prevent link click
            e.preventDefault(); 
            e.stopPropagation();

            const docId = deleteBtn.getAttribute('data-id');
            if (!docId || !currentUserId) return;

            // Simple visual confirmation before delete
            const originalIcon = deleteBtn.innerHTML;
            deleteBtn.innerHTML = '<span class="mdi mdi-loading mdi-spin text-accent"></span>';

            try {
                const docRef = doc(db, 'artifacts', appId, 'users', currentUserId, 'files', docId);
                await deleteDoc(docRef);
            } catch (error) {
                console.error("Error deleting document: ", error);
                deleteBtn.innerHTML = originalIcon;
                // Note: Normally alert is forbidden, but catching edge case network failures
                // UI will revert icon.
            }
        });

        initAuth();

    </script>
</body>
</html>
